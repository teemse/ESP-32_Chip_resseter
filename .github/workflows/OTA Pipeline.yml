name: OTA Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for release (e.g., 1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: false
        type: boolean
      environment:
        description: 'PlatformIO environment (leave empty for all)'
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Определяем какие окружения собирать
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set-matrix.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Parse platformio.ini
        id: set-matrix
        run: |
          pip install configparser
          python << 'PY'
          import json
          import os
          from configparser import ConfigParser
          
          config = ConfigParser()
          config.read('platformio.ini')
          
          # Получаем все окружения кроме глобальных секций
          environments = [
              section.split(':')[1] if ':' in section else section
              for section in config.sections()
              if section not in ['platformio', 'env'] and not section.startswith('env:')
          ]
          
          # Если указано конкретное окружение, используем только его
          specified_env = "${{ inputs.environment }}"
          if specified_env:
              if specified_env in environments:
                  environments = [specified_env]
              else:
                  print(f"⚠️ Environment '{specified_env}' not found, using all")
          
          print(f"Building for environments: {environments}")
          
          # Формируем JSON для matrix
          matrix = {"include": [{"env": env} for env in environments]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"environments={json.dumps(matrix)}\n")
          PY

  build-firmware:
    name: Build ${{ matrix.env }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.environments) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # Кеширование для ускорения сборок
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO Core
      uses: actions/cache@v4
      with:
        path: |
          .pio/core
          ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-

    - name: Cache PlatformIO Dependencies
      uses: actions/cache@v4
      with:
        path: |
          .pio/libdeps
        key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-${{ matrix.env }}-
          ${{ runner.os }}-pio-

    - name: Install PlatformIO
      run: |
        pip install platformio
        pio --version

    - name: Inject Version
      run: |
        VERSION="${{ inputs.version }}"
        COMMIT_HASH="${GITHUB_SHA::7}"
        
        # Если есть platformio.ini с define для версии, обновляем его
        if grep -q "BUILD_VERSION" platformio.ini 2>/dev/null; then
          python << PY
        import re
        from pathlib import Path
        
        ini = Path("platformio.ini")
        content = ini.read_text()
        
        # Обновляем или добавляем define с версией
        if "BUILD_VERSION" in content:
            content = re.sub(
                r'(\s*-DBUILD_VERSION=).*',
                f"\\1'${{ inputs.version }}'",
                content
            )
        ini.write_text(content)
        PY
        fi
        
        echo "Building version: $VERSION (commit: $COMMIT_HASH)"

    - name: Build Firmware
      run: |
        echo "🔨 Building firmware for ${{ matrix.env }}..."
        pio run -e ${{ matrix.env }}

    - name: Build Filesystem
      run: |
        echo "📁 Building filesystem for ${{ matrix.env }}..."
        pio run -t buildfs -e ${{ matrix.env }} || echo "No filesystem target"

    - name: Prepare Artifacts
      run: |
        mkdir -p artifacts/${{ matrix.env }}
        
        ENV="${{ matrix.env }}"
        VERSION="${{ inputs.version }}"
        REPO_NAME="${{ github.event.repository.name }}"
        
        # Копируем firmware
        if [ -f ".pio/build/$ENV/firmware.bin" ]; then
          cp .pio/build/$ENV/firmware.bin \
             artifacts/$ENV/${REPO_NAME}-firmware-${ENV}-v${VERSION}.bin
        fi
        
        # Копируем filesystem
        for FS in spiffs.bin littlefs.bin; do
          if [ -f ".pio/build/$ENV/$FS" ]; then
            cp .pio/build/$ENV/$FS \
               artifacts/$ENV/${REPO_NAME}-${FS%.bin}-${ENV}-v${VERSION}.bin
          fi
        done
        
        # Генерируем манифест для этого окружения
        if [ -f ".pio/build/$ENV/firmware.bin" ]; then
          BIN_PATH=".pio/build/$ENV/firmware.bin"
          SIZE=$(stat -c%s "$BIN_PATH")
          MD5=$(md5sum "$BIN_PATH" | awk '{print $1}')
          SHA256=$(sha256sum "$BIN_PATH" | awk '{print $1}')
          
          cat > artifacts/$ENV/manifest.json << EOF
        {
          "project": "${REPO_NAME}",
          "version": "${VERSION}",
          "environment": "${ENV}",
          "firmware": {
            "name": "${REPO_NAME}-firmware-${ENV}-v${VERSION}.bin",
            "size": ${SIZE},
            "md5": "${MD5}",
            "sha256": "${SHA256}"
          },
          "build_info": {
            "date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${GITHUB_SHA::7}",
            "repository": "${{ github.repository }}"
          }
        }
        EOF
        fi
        
        echo "📦 Artifacts for $ENV:"
        ls -la artifacts/$ENV/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.env }}
        path: artifacts/${{ matrix.env }}/*
        retention-days: 7

  create-release:
    name: Create Release
    needs: build-firmware
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts
        pattern: firmware-*
        merge-multiple: true

    - name: Generate Release Info
      id: release_info
      run: |
        VERSION="${{ inputs.version }}"
        REPO_NAME="${{ github.event.repository.name }}"
        COMMIT_HASH="${GITHUB_SHA::7}"
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
        
        # Создаем структуру для релиза
        mkdir -p release
        
        # Собираем все файлы в одну директорию
        cp -r release-artifacts/* release/ 2>/dev/null || true
        
        # Генерируем общий CHANGELOG
        cat > release/CHANGELOG.md << EOF
        # 🚀 Release v${VERSION}
        
        ## 📦 Build Info
        - **Project:** ${REPO_NAME}
        - **Version:** ${VERSION}
        - **Commit:** ${COMMIT_HASH}
        - **Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
        - **Repository:** ${{ github.repository }}
        
        ## 📊 Artifacts
        EOF
        
        # Добавляем информацию о каждом файле
        echo "| Environment | File | Size | MD5 |" >> release/CHANGELOG.md
        echo "|------------|------|------|-----|" >> release/CHANGELOG.md
        
        for file in release/*.bin; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            size=$(stat -c%s "$file" 2>/dev/null || echo "0")
            size_hr=$(numfmt --to=iec $size 2>/dev/null || echo "${size} bytes")
            md5=$(md5sum "$file" | awk '{print $1}')
            
            # Извлекаем имя окружения из имени файла
            env_name=$(echo "$filename" | sed 's/.*-\([a-zA-Z0-9_-]*\)-v.*/\1/')
            
            echo "| \`${env_name}\` | \`${filename}\` | ${size_hr} | \`${md5}\` |" >> release/CHANGELOG.md
          fi
        done
        
        # Добавляем изменения из git
        echo "" >> release/CHANGELOG.md
        echo "## 🔄 Changes" >> release/CHANGELOG.md
        
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -n "$PREV_TAG" ]; then
          echo "**Since \`${PREV_TAG}\`:**" >> release/CHANGELOG.md
          git log --pretty=format:"- %s (\`%h\`)" $PREV_TAG..HEAD >> release/CHANGELOG.md
        else
          echo "**Latest commits:**" >> release/CHANGELOG.md
          git log --pretty=format:"- %s (\`%h\`)" -10 >> release/CHANGELOG.md
        fi
        
        echo ""
        echo "📁 Release contents:"
        ls -la release/
        
        # Создаем общий манифест
        python << PY
        import json
        import glob
        from pathlib import Path
        
        manifests = []
        for mf in glob.glob("release/**/manifest.json", recursive=True):
            with open(mf) as f:
                manifests.append(json.load(f))
        
        summary = {
            "project": "${{ steps.release_info.outputs.repo_name }}",
            "version": "${{ steps.release_info.outputs.version }}",
            "build_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${GITHUB_SHA::7}",
            "environments": manifests
        }
        
        with open("release/manifest.json", "w") as f:
            json.dump(summary, f, indent=2)
        
        print(f"✅ Created manifest with {len(manifests)} environments")
        PY

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "v${{ inputs.version }}"
        tag_name: "v${{ inputs.version }}"
        body_path: release/CHANGELOG.md
        files: |
          release/**/*.bin
          release/**/*.json
        draft: false
        prerelease: ${{ inputs.prerelease }}
        generate_release_notes: false

    - name: Create Git Tag
      run: |
        VERSION="${{ inputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Проверяем существует ли тег
        if git rev-parse "v$VERSION" >/dev/null 2>&1; then
          echo "⚠️ Tag v$VERSION already exists, skipping"
        else
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "✅ Tag v$VERSION created and pushed"
        fi

    - name: Summary
      run: |
        echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Project:** ${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Release URL:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY